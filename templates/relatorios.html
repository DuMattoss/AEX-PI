{% extends 'base.html' %}

{% block title %}
    Emitir relatório
{% endblock %}

{% block content %}
    <h1>Emitir relatório</h1>

    <div class="report-grid">
        <form class="card" action="{% url 'visualizar_relatorio' %}" method="get">
            <h2>Relatório mensal</h2>

            {% if pode_vender %}
                <label for="categoria-mensal">Conteúdo</label>

                <select name="categoria" id="categoria-mensal">
                    <option value="producao">Produção</option>
                    <option value="vendas">Produção e vendas</option>
                </select>
            {% endif %}

            <input type="hidden" name="tipo" value="mensal">

            <label for="mes">Escolha o mês</label>

            <select name="mes" id="mes" required>
                {% for numero, nome in meses %}
                    <option value="{{ numero }}" {% if numero == hoje.month %}selected{% endif %}>
                        {{ nome }}
                    </option>
                {% endfor %}
            </select>

            <label for="ano-mensal">Escolha o ano</label>

            <input
                type="number"
                name="ano"
                id="ano-mensal"
                min="1900"
                max="9999"
                value="{{ hoje.year|stringformat:'d' }}"
                required
            >

            <button class="button full">
                Continuar
            </button>
        </form>

        <form class="card" action="{% url 'visualizar_relatorio' %}" method="get">
            <h2>Relatório anual</h2>

            {% if pode_vender %}
                <label for="categoria-anual">Conteúdo</label>

                <select name="categoria" id="categoria-anual">
                    <option value="producao">Produção</option>
                    <option value="vendas">Produção e vendas</option>
                </select>
            {% endif %}

            <input type="hidden" name="tipo" value="anual">

            <label for="ano-anual">Escolha o ano</label>

            <input
                type="number"
                name="ano"
                id="ano-anual"
                min="1900"
                max="9999"
                value="{{ hoje.year|stringformat:'d' }}"
                required
            >

            <button class="button full">
                Continuar
            </button>
        </form>
    </div>
{% endblock %}
