{% extends 'base.html' %}{% block title %}Entrar{% endblock %}{% block main_class %}login-main{% endblock %}
{% block content %}<section class="card login-card"><h1>Entrar</h1><form method="post">{% csrf_token %}{% if form.errors %}<div class="message error" role="alert">Login ou senha incorretos. Verifique os dados e tente novamente.</div>{% endif %}<label for="id_username">Login</label><input id="id_username" name="username" autocomplete="username" required autofocus maxlength="150" value="{{ form.username.value|default:'' }}"><label for="id_password">Senha</label><input id="id_password" name="password" type="password" autocomplete="current-password" required><input type="hidden" name="next" value="{{ next }}"><button class="button full">Entrar</button></form></section>{% endblock %}
